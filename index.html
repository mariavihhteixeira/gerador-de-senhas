<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gerador de senhas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="conteudo">
        <div class="conteudo-titulo">
            <img src="" alt="cadeado fechado">
            <h2 class="titulo-principal">gerador de senhas</h2>
            <h3 class="titulo-secundario">gere instantaneamente uma senha aleatoria e segura</h3>

        </div>
        <div class="conteudo-senha">
            <label for="senha">senha</label>
            <input name = "senha" type="text" id="campo-senha">

        </div>
        <div class="parametro">
            <h3 class="parametro-titulo">personalize a sua senha</h3>
            <div class="parametro-coluna__senha">
                <div class="parametro-senha">
                    <h4 class="parametro-senha__titulo">numero de caracteres</h4>
                    <div class="parametro-senha-botoes">
                        <button class="parametro-senha__botao">-</button>
                        <p class="parametro-senha__texto">12</p>
                        <button class="parametro-senha__botao">+</button>

                    </div>
                </div>
                <div class="parametro-senha">
                    <h4 class="parametro-senha__titulo">caracteristicas da senha</h4>
                    <div class="parametro-senha-checkbox">
                        <input name= "maiusculo" type="checkbox" checked>
                        <label for="maiusculo">letras maiusculas</label>

                    </div>
                    <div class="parametro-senha-checkbox">
                        <input name= "minusculo" type="checkbox" checked>
                        <label for="minusculo">letras minusculas</label>
                        
                    </div>
                    <div class="parametro-senha-checkbox">
                        <input name= "numero" type="checkbox" checked>
                        <label for="numero">numero</label>
                        
                    </div>
                    <div class="parametro-senha-checkbox">
                        <input name= "simbolos" type="checkbox" checked>
                        <label for="simbolos">simbolos</label>
                        
                    </div>
                

                </div>
                <div class="parametro-senha">
                    <h4 class="parametro-senha__titulo">forca da senha</h4>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
